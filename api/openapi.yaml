openapi: 3.1.0
info:
  title: Odprta šola – pogodba P0, M1, M2
  version: 1.0.0
  description: >
    Pogodba D12, različica 1.0.0, sprejeta 13. 11. 2026 (naročnik: pobudnik, skupni tehnični
    nosilec; mentorji so izvajalci). Odvisne ekipe nanjo vežejo implementacijo. Vsebinska
    razlaga je v docs/arhitektura/vmesnik-P0-M1-M2.md. Pot /_stub/* obstaja samo v nadomestkih
    in ni del pogodbe. Vrednosti v primerih so izmišljene.
    Splošne napake: neznana pot API vrne 404, napačna metoda 405, zavrnitev CSRF pri sejnem
    klicu 403, nepričakovana napaka 500 in nedosegljiva evidenca 503; vse z vsebino Error
    (application/json).
    Spremembe: vsaka sprememba te datoteke zahteva novo različico in vrstico v
    api/zamrznitve.txt; sprememba z vplivom na ekipe potrebuje odobritev naročnika,
    nezdružljiva pa novo glavno različico ali dogovorjen prehod (C16).
servers:
  - url: http://localhost:8000
paths:
  /p0/api/v1/me:
    get:
      summary: Lastna identiteta iz seje
      security: [{sessionCookie: []}]
      responses:
        "200": {description: Oseba, content: {application/json: {schema: {$ref: "#/components/schemas/Me"}}}}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
  /p0/api/v1/me/relationships:
    get:
      summary: Lastne veljavne povezave z otroki in sklici na obsege
      security: [{sessionCookie: []}]
      responses:
        "200": {description: Povezave, content: {application/json: {schema: {$ref: "#/components/schemas/Relationships"}}}}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
  /p0/api/v1/me/classes:
    get:
      summary: Dodeljeni oddelki zaposlenega
      security: [{sessionCookie: []}]
      responses:
        "200": {description: Oddelki, content: {application/json: {schema: {$ref: "#/components/schemas/Classes"}}}}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
  /p0/api/v1/authorizations/check:
    post:
      summary: Aktualna pravica osebe za obseg in dejanje
      description: >
        Uporabniški klic (seja, CSRF) preverja lastno pravico; subject_id je neobvezen in mora
        biti lastni. Servisni klic zahteva subject_id. Nedosegljivost je 503, ne NOT_ALLOWED.
      security: [{sessionCookie: []}, {serviceBearer: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/AuthCheckRequest"}}}
      responses:
        "200": {description: Rezultat, content: {application/json: {schema: {$ref: "#/components/schemas/AuthCheckResponse"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /p0/api/v1/audiences/resolve:
    post:
      summary: Predogled dovoljenih prejemnikov oddelka za prijavljenega avtorja; shrani posnetek občinstva
      description: >
        Uporabniški klic (seja, CSRF); avtor je oseba iz seje z veljavno dodelitvijo oddelka.
        P0 shrani posnetek občinstva (audience_ref, rok expires_at), na katerega se veže razrešitev
        kontaktov ob dostavi (D12, C07). Rok posnetka 30 dni je predlog.
      security: [{sessionCookie: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/AudienceRequest"}}}
      responses:
        "200": {description: Predogled, content: {application/json: {schema: {$ref: "#/components/schemas/AudienceResponse"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /p0/api/v1/delivery-contacts/resolve:
    post:
      summary: Kontakt za prejemnika iz posnetka občinstva tik pred pošiljanjem (samo M1)
      description: >
        Kontakt se vrne samo za prejemnika s tem sklicem v neizteklem posnetku audience_ref in ob
        aktualnem upravičenju za namen posnetka. Tuj, neobstoječ, potekel ali odvzet vhod: enak 403.
      security: [{serviceBearer: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/ContactRequest"}}}
      responses:
        "200": {description: Kontakt ali odsotnost, content: {application/json: {schema: {$ref: "#/components/schemas/ContactResponse"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /m1/api/v1/delivery-requests:
    post:
      summary: Trajni prevzem zahteve za dostavo
      description: >
        202 šele po trajnem zapisu zahteve in vseh postavk (C11); brez njega 503. Isti
        idempotency_key in vsebina vrneta isti prevzem 30 dni po prevzemu, tudi po expires_at
        (brez nove dostave in brez podaljšanja roka); nato 409 replay_window_expired. Drugačna
        vsebina istega ključa je 409 idempotency_conflict. Nova zahteva s pretečenim rokom je 400.
        Poslovni ključ postavke je (klicatelj, event_key, person_id, scope_ref): nova zahteva,
        ki ponovi že prevzeto postavko istega dogodka, je 409 duplicate_event in ne prevzame
        ničesar (C08). Pri kind=reminder ima vsaka postavka need_ref, pri drugih vrstah ne (C09).
      security: [{serviceBearer: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/DeliveryRequest"}}}
      responses:
        "202": {description: Prevzeto, content: {application/json: {schema: {$ref: "#/components/schemas/DeliveryStatus"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /m1/api/v1/delivery-requests/{id}:
    get:
      summary: Stanje lastne zahteve po prejemnikih
      security: [{serviceBearer: []}]
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: Stanje, content: {application/json: {schema: {$ref: "#/components/schemas/DeliveryStatus"}}}}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /m1/api/v1/delivery-requests/{id}/cancel:
    post:
      summary: Selektivni, ponovljiv preklic izbranih postavk (oseba in obseg)
      security: [{serviceBearer: []}]
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/CancelRequest"}}}
      responses:
        "200": {description: Rezultat po prejemniku, content: {application/json: {schema: {$ref: "#/components/schemas/CancelResponse"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /m2/api/v1/reminders/check:
    post:
      summary: Ali je opomnik še potreben (samo REQUIRED ali NO_LONGER_REQUIRED)
      description: >
        need_ref je sklic na eno potrebo (oseba, obseg, vir, različica) in mora pripadati
        recipient_id in scope_ref (C09). Tuj, neznan ali potekel sklic je 404, ne »nepotreben«.
        Napaka ali nedosegljivost ni odgovor »nepotreben«. Ne razkrije vsebine odločitve.
      security: [{serviceBearer: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/ReminderCheckRequest"}}}
      responses:
        "200": {description: Potreba, content: {application/json: {schema: {$ref: "#/components/schemas/ReminderCheckResponse"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
components:
  securitySchemes:
    sessionCookie: {type: apiKey, in: cookie, name: sessionid}
    serviceBearer: {type: http, scheme: bearer}
  responses:
    Error:
      description: Napaka. Sporočilo ne razkriva tujih virov ali skrivnosti.
      content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
  schemas:
    Error:
      type: object
      required: [code, message, trace_id]
      properties:
        code: {type: string}
        message: {type: string}
        trace_id: {type: string}
    Id: {type: string, minLength: 1, maxLength: 256}
    Permission:
      type: string
      description: Šifrant dovoljenj modulov (osnutek).
      enum: [m1.confirm, m2.decide]
    Me:
      type: object
      required: [person_id, display_name, roles, preferred_language]
      properties:
        person_id: {$ref: "#/components/schemas/Id"}
        display_name: {type: string}
        roles: {type: array, items: {type: string, enum: [parent, student, teacher, office, admin]}}
        preferred_language: {type: string}
    Scope:
      type: object
      required: [scope_ref, permission]
      properties:
        scope_ref: {$ref: "#/components/schemas/Id"}
        permission: {$ref: "#/components/schemas/Permission"}
    Relationships:
      type: object
      required: [relationships]
      properties:
        relationships:
          type: array
          items:
            type: object
            required: [relationship_id, student_id, student_display_name, relationship_type, valid_from, valid_until, scopes]
            properties:
              relationship_id: {type: integer}
              student_id: {$ref: "#/components/schemas/Id"}
              student_display_name: {type: string}
              relationship_type: {type: string, enum: [parent, guardian]}
              valid_from: {type: string, format: date-time}
              valid_until: {type: [string, "null"], format: date-time}
              scopes: {type: array, items: {$ref: "#/components/schemas/Scope"}}
    Classes:
      type: object
      required: [classes]
      properties:
        classes:
          type: array
          items:
            type: object
            required: [class_id, class_key, name, school_year]
            properties:
              class_id: {$ref: "#/components/schemas/Id"}
              class_key: {type: string}
              name: {type: string}
              school_year: {type: string}
    AuthCheckRequest:
      type: object
      required: [scope_ref, permission]
      additionalProperties: false
      properties:
        subject_id: {$ref: "#/components/schemas/Id"}
        scope_ref: {$ref: "#/components/schemas/Id"}
        permission: {type: string, minLength: 1, maxLength: 64}
    AuthCheckResponse:
      type: object
      required: [allowed, reason_code, checked_at]
      properties:
        allowed: {type: boolean}
        reason_code: {type: string, enum: [ALLOWED, NOT_ALLOWED, SCOPE_INACTIVE]}
        checked_at: {type: string, format: date-time}
      if: {properties: {allowed: {const: true}}}
      then: {properties: {reason_code: {const: ALLOWED}}}
      else: {properties: {reason_code: {enum: [NOT_ALLOWED, SCOPE_INACTIVE]}}}
    AudienceRequest:
      type: object
      required: [class_id, purpose]
      additionalProperties: false
      properties:
        class_id: {$ref: "#/components/schemas/Id"}
        purpose: {type: string, enum: [notice, form]}
    AudienceResponse:
      type: object
      required: [audience_ref, version, previewed_at, expires_at, recipients]
      properties:
        audience_ref: {$ref: "#/components/schemas/Id"}
        version: {type: integer}
        previewed_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        recipients:
          type: array
          items:
            type: object
            required: [person_id, scope_ref, display_label, student_label]
            properties:
              person_id: {$ref: "#/components/schemas/Id"}
              scope_ref: {$ref: "#/components/schemas/Id"}
              display_label: {type: string}
              student_label: {type: string}
    ContactRequest:
      type: object
      required: [recipient_id, scope_ref, audience_ref]
      additionalProperties: false
      properties:
        recipient_id: {$ref: "#/components/schemas/Id"}
        scope_ref: {$ref: "#/components/schemas/Id"}
        audience_ref: {$ref: "#/components/schemas/Id"}
    ContactResponse:
      type: object
      required: [deliverable, reason_code]
      properties:
        deliverable: {type: boolean}
        reason_code: {type: string, enum: [OK, NO_CONTACT]}
        email: {type: string, format: email}
        locale: {type: string}
      if: {properties: {deliverable: {const: true}}}
      then: {required: [email, locale], properties: {reason_code: {const: OK}}}
      else: {not: {anyOf: [{required: [email]}, {required: [locale]}]}, properties: {reason_code: {const: NO_CONTACT}}}
    DeliveryRequest:
      type: object
      required: [idempotency_key, event_key, kind, audience_ref, recipients, template_id, params, target, expires_at]
      additionalProperties: false
      properties:
        idempotency_key: {$ref: "#/components/schemas/Id"}
        event_key:
          $ref: "#/components/schemas/Id"
          description: >
            Poslovni ključ dogodka (vir, različica, vrsta, zaporedna številka opomnika), npr.
            form-demo-01:v1:reminder:2. Naslednji načrtovani opomnik ima novo številko (C08).
        audience_ref: {$ref: "#/components/schemas/Id"}
        kind: {type: string, enum: [notification, reminder, receipt, change_notice]}
        recipients:
          type: array
          description: >
            Postavka je par (person_id, scope_ref); ista oseba z več obsegi je več postavk, ponovljen
            par je 400 (D12, C12).
          minItems: 1
          maxItems: 200
          items:
            type: object
            required: [person_id, scope_ref]
            additionalProperties: false
            properties:
              person_id: {$ref: "#/components/schemas/Id"}
              scope_ref: {$ref: "#/components/schemas/Id"}
              need_ref:
                $ref: "#/components/schemas/Id"
                description: Obvezen pri kind=reminder in samo pri njem; ena potreba (C09).
              locale:
                type: string
                minLength: 2
                maxLength: 16
                description: >
                  Izrecna preglasitev jezika za to postavko. Privzeto jezik prejemnika iz P0;
                  ni skupne vrednosti za vse prejemnike (C03).
        template_id: {$ref: "#/components/schemas/Id"}
        params: {type: object, maxProperties: 50}
        target:
          type: object
          required: [module, resource_id]
          additionalProperties: false
          properties:
            module: {type: string, enum: [M1, M2]}
            resource_id: {$ref: "#/components/schemas/Id"}
        expires_at: {type: string, format: date-time, maxLength: 64}
    RecipientState:
      type: string
      enum: [queued, held, handed_off, failed, cancelled, expired]
    ReasonCode:
      description: >
        Razlog stanja postavke (C06, C09, C10, C13, C03): QUIET_HOURS (čaka na dovoljeni čas),
        DELIVERY_WINDOW_EXPIRED (pred iztekom ni bilo dovoljenega časa), NOT_ALLOWED (odvzeto ali
        nedovoljeno ob obdelavi; zadržano), NO_CONTACT (papirna pot), TRANSLATION_MISSING (brez
        tihe zamenjave jezika), NO_LONGER_REQUIRED (M2), CHECK_UNAVAILABLE (preverjanje ni uspelo),
        HANDOFF_UNCERTAIN (negotova poštna predaja; ponovitev samo z ročno odločitvijo).
      type: [string, "null"]
      enum: [QUIET_HOURS, DELIVERY_WINDOW_EXPIRED, NOT_ALLOWED, NO_CONTACT, TRANSLATION_MISSING, NO_LONGER_REQUIRED, CHECK_UNAVAILABLE, HANDOFF_UNCERTAIN, null]
    DeliveryStatus:
      type: object
      required: [delivery_request_id, state, recipients, counts]
      properties:
        delivery_request_id: {$ref: "#/components/schemas/Id"}
        state: {type: string}
        recipients:
          type: array
          items:
            type: object
            required: [item_id, person_id, scope_ref, state, reason_code]
            properties:
              item_id: {$ref: "#/components/schemas/Id"}
              person_id: {$ref: "#/components/schemas/Id"}
              scope_ref: {$ref: "#/components/schemas/Id"}
              state: {$ref: "#/components/schemas/RecipientState"}
              reason_code: {$ref: "#/components/schemas/ReasonCode"}
        counts:
          type: object
          additionalProperties: {type: integer}
    CancelRequest:
      type: object
      required: [item_ids]
      additionalProperties: false
      properties:
        item_ids: {type: array, minItems: 1, maxItems: 200, items: {$ref: "#/components/schemas/Id"}}
    CancelResponse:
      type: object
      required: [delivery_request_id, recipients]
      properties:
        delivery_request_id: {$ref: "#/components/schemas/Id"}
        recipients:
          type: array
          items:
            type: object
            required: [item_id, person_id, state, cancel_result]
            properties:
              item_id: {$ref: "#/components/schemas/Id"}
              person_id: {$ref: "#/components/schemas/Id"}
              state: {$ref: "#/components/schemas/RecipientState"}
              cancel_result: {type: string, enum: [cancelled_now, already_cancelled, too_late, already_terminal]}
    ReminderCheckRequest:
      type: object
      required: [need_ref, recipient_id, scope_ref]
      additionalProperties: false
      properties:
        need_ref: {$ref: "#/components/schemas/Id"}
        recipient_id: {$ref: "#/components/schemas/Id"}
        scope_ref: {$ref: "#/components/schemas/Id"}
    ReminderCheckResponse:
      type: object
      required: [needed, reason_code]
      properties:
        needed: {type: boolean}
        reason_code: {type: string, enum: [REQUIRED, NO_LONGER_REQUIRED]}
