# Razvojno okolje P0 na izmišljenih podatkih. Ni za produkcijo.
services:
  db:
    image: postgres:18@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42  # 16.15
    environment:
      POSTGRES_DB: p0
      POSTGRES_USER: p0
      POSTGRES_PASSWORD: p0-razvoj
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["dbdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U p0 -d p0"]
      interval: 3s
      retries: 20

  mail:
    # Prestrezni predal: vsa razvojna e-pošta konča tu, nikoli pri resničnem naslovniku.
    image: axllent/mailpit:v1.33.1@sha256:aef2aacc11f075ec0fb6874275ee4a421e688e11a96ebb296134d1735c7761ce
    ports: ["127.0.0.1:8025:8025", "127.0.0.1:1025:1025"]

  p0:
    build:
      context: ./p0
      args: {INSTALL_DEV: "1"}
    command: sh -c "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"
    environment:
      DJANGO_DEBUG: "1"
      POSTGRES_HOST: db
      EMAIL_HOST: mail
    volumes: ["./p0:/app", "./data:/data:ro", "./api:/api:ro"]
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      db: { condition: service_healthy }

volumes:
  dbdata:
