# Razvojno okolje P0 na izmišljenih podatkih. Ni za produkcijo.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: p0
      POSTGRES_USER: p0
      POSTGRES_PASSWORD: p0-razvoj
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["dbdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U p0 -d p0"]
      interval: 3s
      retries: 20

  mail:
    # Prestrezni predal: vsa razvojna e-pošta konča tu, nikoli pri resničnem naslovniku.
    image: axllent/mailpit:latest
    ports: ["127.0.0.1:8025:8025", "127.0.0.1:1025:1025"]

  p0:
    build: ./p0
    command: python manage.py runserver 0.0.0.0:8000
    environment:
      DJANGO_DEBUG: "1"
      POSTGRES_HOST: db
      EMAIL_HOST: mail
    volumes: ["./p0:/app"]
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      db: { condition: service_healthy }

volumes:
  dbdata:
