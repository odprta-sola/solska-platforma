# Razvojno okolje P0 na izmišljenih podatkih. Ni za produkcijo.
services:
  db:
    image: postgres:16@sha256:f9a7b9ebf6f56201f949db745e47bc423c0f0f8294bafe991cc10bf74b029657  # 16.15
    environment:
      POSTGRES_DB: p0
      POSTGRES_USER: p0
      POSTGRES_PASSWORD: p0-razvoj
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["dbdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U p0 -d p0"]
      interval: 3s
      retries: 20

  mail:
    # Prestrezni predal: vsa razvojna e-pošta konča tu, nikoli pri resničnem naslovniku.
    image: axllent/mailpit:v1.33.1@sha256:aef2aacc11f075ec0fb6874275ee4a421e688e11a96ebb296134d1735c7761ce
    ports: ["127.0.0.1:8025:8025", "127.0.0.1:1025:1025"]

  p0:
    build:
      context: ./p0
      args: {INSTALL_DEV: "1"}
    command: sh -c "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"
    environment:
      DJANGO_DEBUG: "1"
      POSTGRES_HOST: db
      EMAIL_HOST: mail
    volumes: ["./p0:/app", "./data:/data:ro", "./api:/api:ro"]
    ports: ["127.0.0.1:8000:8000"]
    # Zdrav šele po migracijah (migrate teče pred runserver) in z dosegljivo zbirko.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/p0/api/v1/health')"]
      interval: 3s
      retries: 40
    depends_on:
      db: { condition: service_healthy }

  cleanup:
    # Čiščenje brez uporabniškega prometa (vsako uro): začasne datoteke predogleda uvoza
    # in potekli posnetki občinstva.
    build:
      context: ./p0
      args: {INSTALL_DEV: "1"}
    command: sh -c "while true; do python manage.py purge_import_uploads; python manage.py purge_audience_snapshots; sleep 3600; done"
    environment:
      DJANGO_DEBUG: "1"
      POSTGRES_HOST: db
    volumes: ["./p0:/app"]
    depends_on:
      db: { condition: service_healthy }
      p0: { condition: service_healthy }

volumes:
  dbdata:
