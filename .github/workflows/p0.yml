name: P0

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  preverjanje:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: p0
          POSTGRES_USER: p0
          POSTGRES_PASSWORD: p0-ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U p0" --health-interval 5s --health-retries 10
    env:
      DJANGO_DEBUG: "1"
      POSTGRES_PASSWORD: p0-ci
    defaults:
      run:
        working-directory: p0
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: p0/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py check
      - run: python manage.py test
