name: P0

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  preverjanje:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16@sha256:f9a7b9ebf6f56201f949db745e47bc423c0f0f8294bafe991cc10bf74b029657  # 16.15
        env:
          POSTGRES_DB: p0
          POSTGRES_USER: p0
          POSTGRES_PASSWORD: p0-ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U p0" --health-interval 5s --health-retries 10
    env:
      DJANGO_DEBUG: "1"
      POSTGRES_PASSWORD: p0-ci
    defaults:
      run:
        working-directory: p0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12.16"
          cache: pip
          cache-dependency-path: p0/requirements*.lock
      - run: python -m pip install --require-hashes -r requirements-build.lock
      - run: python -m pip install --require-hashes --no-deps -r requirements-dev.lock
      - run: python -m pip check
      - name: Zaklepi ustrezajo vhodnim zahtevam
        run: |
          python -m pip install --no-index --dry-run -r requirements-dev.txt -r requirements-build.txt > /tmp/zaklep.txt
          ! grep -q "Would install" /tmp/zaklep.txt || { cat /tmp/zaklep.txt; echo "::error::Zaklep ni usklajen z requirements*.txt"; exit 1; }
      - run: ruff check .
      - run: ruff format --check .
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py check
      - run: python manage.py test
